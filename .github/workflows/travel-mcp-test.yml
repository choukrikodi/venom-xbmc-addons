name: travel-mcp-test

on:
  workflow_dispatch:
  push:
    branches: [claude/travel-agent-skill-setup-vhqmwf]
    paths: [.github/workflows/travel-mcp-test.yml, skills/travel-agent/scripts/**, skills/travel-agent/evals/files/**]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List tools
        run: |
          C=skills/travel-agent/scripts/mcp_call.py
          mkdir -p out
          python3 $C https://mcp.kiwi.com list > out/tools_kiwi.json || true
          python3 $C https://mcp.trivago.com/mcp list > out/tools_trivago.json || true
      - name: Local tests (no network)
        run: python3 -B skills/travel-agent/evals/test_mcp_call.py
      - name: Test calls
        id: calls
        run: TRAVEL_CASE_FILE=skills/travel-agent/evals/files/asie_v2.json bash skills/travel-agent/scripts/test_case.sh
      - name: Save raw responses to branch
        if: always() && steps.calls.outcome != 'skipped'
        run: |
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          rm -rf skills/travel-agent/test-output && mv out skills/travel-agent/test-output
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add skills/travel-agent/test-output
          git commit -m "Raw MCP responses (run ${{ github.run_id }})" && git push || true
