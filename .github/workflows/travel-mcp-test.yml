name: travel-mcp-test

on:
  workflow_dispatch:
    inputs:
      case_file:
        description: Manifeste de requêtes (chemin dans le dépôt)
        default: skills/travel-agent/evals/files/asie_v2.json
      output_dir:
        description: Dossier de sortie commité
        default: skills/travel-agent/test-output
  push:
    branches: [claude/travel-agent-skill-setup-vhqmwf]
    paths: [.github/workflows/travel-mcp-test.yml, skills/travel-agent/scripts/**, skills/travel-agent/evals/files/*.json]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    # Un manifeste à la fois : espacement Kiwi et push du bot sérialisés.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - case: ${{ inputs.case_file || 'skills/travel-agent/evals/files/asie_v2.json' }}
            out: ${{ inputs.output_dir || 'skills/travel-agent/test-output' }}
          - case: ${{ inputs.case_file || 'skills/travel-agent/evals/files/asie_v3.json' }}
            out: ${{ inputs.output_dir || 'skills/travel-agent/test-output-v3' }}
          - case: ${{ inputs.case_file || 'skills/travel-agent/evals/files/asie_v4_tun.json' }}
            out: ${{ inputs.output_dir || 'skills/travel-agent/test-output-v4-tun' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether this manifest changed
        id: decide
        run: |
          CASE="${{ matrix.case }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qx "$CASE"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Manifeste inchangé, traces conservées : $CASE"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: List tools
        if: steps.decide.outputs.run == 'true'
        run: |
          C=skills/travel-agent/scripts/mcp_call.py
          mkdir -p out
          python3 $C https://mcp.kiwi.com list > out/tools_kiwi.json || true
          python3 $C https://mcp.trivago.com/mcp list > out/tools_trivago.json || true
      - name: Local tests (no network)
        run: python3 -B skills/travel-agent/evals/test_mcp_call.py
      - name: Test calls
        id: calls
        if: steps.decide.outputs.run == 'true'
        run: TRAVEL_CASE_FILE="${{ matrix.case }}" bash skills/travel-agent/scripts/test_case.sh
      - name: Save raw responses to branch
        if: always() && steps.calls.outcome != 'skipped'
        run: |
          DEST="${{ matrix.out }}"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          rm -rf "$DEST" && mv out "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Raw MCP responses (run ${{ github.run_id }}, ${{ matrix.out }})" && git push || true
