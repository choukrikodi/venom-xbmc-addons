<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andaman 2026 à 7 500 €</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1720; color: #f5f2ec; }
  main { max-width: 560px; padding: 2rem 16px; text-align: center; }
  h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
  p.sub { opacity: 0.7; margin-top: 0; margin-bottom: 2rem; }
  .cards { display: grid; gap: 1rem; }
  a.card { display: block; padding: 1.25rem 1.5rem; border: 1px solid rgba(245,242,236,0.2); border-radius: 12px; text-decoration: none; color: inherit; transition: background 0.15s ease, border-color 0.15s ease; }
  a.card:hover { background: rgba(245,242,236,0.06); border-color: rgba(245,242,236,0.4); }
  a.card .title { font-weight: 600; font-size: 1.05rem; }
  a.card .desc { opacity: 0.65; font-size: 0.9rem; margin-top: 0.25rem; }
  a.back { color: inherit; opacity: 0.7; display: inline-block; margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <h1>Andaman 2026 à 7 500 €</h1>
  <p class="sub">Le voyage optimisé pour un budget de 7 500 € pour deux</p>
  <div class="cards">
    <a class="card" href="visite/">
      <div class="title">Visite</div>
      <div class="desc">Présentation des trois circuits optimisés : carte du trajet, hôtels retenus, programme</div>
    </a>
    <a class="card" href="construction/">
      <div class="title">Construction</div>
      <div class="desc">Choix des hôtels, optimiseur sous le plafond et budget total qui se recalcule</div>
    </a>
  </div>
  <a class="back" href="../">← Andaman 2026</a>
</main>
</body>
</html>
