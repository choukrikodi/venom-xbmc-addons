<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andaman 2026</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1720;
    color: #f5f2ec;
  }
  main { max-width: 560px; padding: 2rem; text-align: center; }
  h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
  p.sub { opacity: 0.7; margin-top: 0; margin-bottom: 2rem; }
  .cards { display: grid; gap: 1rem; }
  a.card {
    display: block;
    padding: 1.25rem 1.5rem;
    border: 1px solid rgba(245,242,236,0.2);
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  a.card:hover { background: rgba(245,242,236,0.06); border-color: rgba(245,242,236,0.4); }
  a.card .title { font-weight: 600; font-size: 1.05rem; }
  a.card .desc { opacity: 0.65; font-size: 0.9rem; margin-top: 0.25rem; }
</style>
</head>
<body>
<main>
  <h1>Andaman 2026</h1>
  <p class="sub">Voyage Thaïlande — versions Configurateur et Visite</p>
  <div class="cards">
    <a class="card" href="configurateur/">
      <div class="title">Configurateur</div>
      <div class="desc">Choix des vols, hôtels et options — calcul du prix total</div>
    </a>
    <a class="card" href="visite/">
      <div class="title">Visite</div>
      <div class="desc">Présentation du voyage, hôtels et excursions</div>
    </a>
  </div>
</main>
</body>
</html>
