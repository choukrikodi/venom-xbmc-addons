interface:
  display_name: "Agent de voyage"
  short_description: "Planifier ou comparer un voyage sans réservation"
  default_prompt: "Charge SKILL.md, suis les 7 phases, écris ## Hypothèses avant tout chiffrage, ne réserve rien."
dependencies:
  tools:
    - type: "mcp"
      value: "kiwi"
      description: "Kiwi.com, vols avec bagages de soute"
      transport: "streamable_http"
      url: "https://mcp.kiwi.com"
    - type: "mcp"
      value: "trivago"
      description: "Trivago, hôtels et tendances"
      transport: "streamable_http"
      url: "https://mcp.trivago.com/mcp"
    - type: "mcp"
      value: "frankfurter"
      description: "Taux de change BCE"
      transport: "streamable_http"
      url: "https://mcp.frankfurter.dev/"
    - type: "mcp"
      value: "open-meteo"
      description: "Météo, normales et prévisions"
    - type: "mcp"
      value: "osm"
      description: "OpenStreetMap, géocodage et distances"
    - type: "mcp"
      value: "playwright"
      description: "Relire la page de réservation avant tout prix confirmé"
policy:
  allow_implicit_invocation: true
